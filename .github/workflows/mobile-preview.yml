name: Mobile preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'assets/**'
      - 'web/**'
      - 'scripts/build_*.py'
      - '.github/workflows/mobile-preview.yml'

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install host linker
        run: sudo apt-get update && sudo apt-get install -y clang mold
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-28
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - run: cargo install cargo-apk --version 0.10.0 --locked
      - run: python3 scripts/build_android.py
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
      - uses: actions/upload-artifact@v4
        with:
          name: robbers-android-arm64-debug
          path: target/debug/apk/robbers.apk
          if-no-files-found: error
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install host linker
        run: sudo apt-get update && sudo apt-get install -y clang mold
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-28
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: python3 scripts/build_web.py --release
      - uses: actions/upload-artifact@v4
        with:
          name: robbers-web
          path: target/web/
          if-no-files-found: error
