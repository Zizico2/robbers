<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#13252b">
  <title>Robbers — Investigation</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #13252b; color: #efe6cc; font: 16px system-ui, sans-serif; }
    #game { position: fixed; top: env(safe-area-inset-top); right: env(safe-area-inset-right); bottom: env(safe-area-inset-bottom); left: env(safe-area-inset-left); }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
    .cover { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; background: #13252b; gap: 16px; }
    h1 { margin: 0; letter-spacing: .25em; font-size: 32px; }
    p { margin: 0; max-width: 36em; line-height: 1.5; }
    button { min-height: 48px; padding: 12px 24px; border: 1px solid #e3bd73; border-radius: 6px; background: #4f4a2e; color: inherit; font: inherit; cursor: pointer; }
    [hidden] { display: none !important; }
    #rotate { display: none; z-index: 20; }
    @media (orientation: portrait) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <main id="game"><canvas id="robbers" tabindex="0" aria-label="Robbers game board"></canvas></main>
  <section id="start" class="cover">
    <h1>ROBBERS</h1>
    <p id="status">Investigate witnesses and reconstruct the getaway route. Play in landscape. Tap highlighted hexes to move; open Notes to read your evidence.</p>
    <button id="play">Play</button>
    <button id="fullscreen">Play fullscreen</button>
  </section>
  <section id="rotate" class="cover" role="status"><h1>ROBBERS</h1><p>Rotate your device to landscape to investigate the city.</p></section>
  <script type="module">
    import init from './robbers.js';
    const start = document.querySelector('#start');
    const status = document.querySelector('#status');
    async function play(fullscreen) {
      document.querySelectorAll('button').forEach(button => button.disabled = true);
      status.textContent = 'Opening the case…';
      if (fullscreen) {
        try {
          await document.documentElement.requestFullscreen();
          await screen.orientation.lock('landscape');
        } catch { /* Browser support varies; the rotation prompt still applies. */ }
      }
      try {
        await init();
        start.hidden = true;
        document.querySelector('canvas').focus();
      } catch (error) {
        status.textContent = `Could not open the game. A browser supporting WebGL 2 is required. ${error}`;
      }
    }
    document.querySelector('#play').addEventListener('click', () => play(false));
    document.querySelector('#fullscreen').addEventListener('click', () => play(true));
  </script>
</body>
</html>
