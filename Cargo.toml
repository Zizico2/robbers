[workspace]
resolver = "3"
members = ["crates/*", "platforms/android"]
default-members = ["."]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
bevy = { version = "0.20.0", default-features = false, features = ["std", "async_executor", "multi_threaded", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
robbers-case = { path = "crates/robbers-case" }
robbers-validator = { path = "crates/robbers-validator" }
robbers-types = { path = "crates/robbers-types" }
robbers-game = { path = "crates/robbers-game" }
robbers-command = { path = "crates/robbers-command" }
robbers-headless = { path = "crates/robbers-headless" }
robbers-view = { path = "crates/robbers-view" }
robbers-app = { path = "crates/robbers-app", default-features = false }

[package]
name = "robbers"
version.workspace = true
edition.workspace = true
default-run = "robbers"

[dependencies]
bevy.workspace = true
robbers-game.workspace = true
robbers-case.workspace = true
robbers-validator.workspace = true
robbers-command.workspace = true
robbers-headless.workspace = true
robbers-app = { workspace = true, optional = true, features = ["graphics"] }
serde_json.workspace = true

[features]
default = ["graphics", "dev"]
graphics = ["dep:robbers-app"]
dev = ["graphics", "bevy/dynamic_linking"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
